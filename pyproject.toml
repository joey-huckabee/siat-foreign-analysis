[project]
name = "siat-foreign-analysis"
version = "1.3.0"
description = "Score adversarial contribution in GitHub-Metrics repository documents"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10,<4.0"
authors = [{ name = "Joey Huckabee", email = "joey.huckabee@gmail.com" }]
keywords = ["foss", "open-source", "analysis", "supply-chain", "github"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]

# Deliberately empty. Everything this package needs is in the standard
# library, including the argument parsing, and it stays that way: the tool
# reads documents from a classified-adjacent pipeline, so every dependency
# added here is one more thing to account for.
dependencies = []

[project.urls]
Homepage = "https://github.com/joey-huckabee/siat-foreign-analysis"
Repository = "https://github.com/joey-huckabee/siat-foreign-analysis"
Issues = "https://github.com/joey-huckabee/siat-foreign-analysis/issues"

[project.scripts]
siat-foreign-analysis = "siat_foreign_analysis.cli:main"

[tool.poetry]
requires-poetry = ">=2.0"
packages = [{ include = "siat_foreign_analysis" }]

# Replaces requirements-dev.txt, which listed five tools as bare names with no
# pins, while this file carried only their settings. One file describes the
# toolchain now, and every tool the configuration mentions is installed by it.
[tool.poetry.group.dev.dependencies]
black = ">=24.10.0"
isort = ">=5.13.2"
mypy = ">=1.13.0"
pre-commit = ">=4.0.1"
pylint = ">=3.3.1"
pytest = ">=8.3.0"
pytest-cov = ">=6.0.0"
ruff = ">=0.8.0"
vulture = ">=2.13"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

# ---------------------------------------------------------------------------
# Formatting
# ---------------------------------------------------------------------------

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["siat_foreign_analysis"]

# ---------------------------------------------------------------------------
# Linting
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
# `I` (isort) is intentionally omitted: isort owns import ordering here.
#
# The second row covers the ground SonarCloud's Python rules cover, so a
# finding surfaces here - on a developer's machine, in seconds - rather than
# on a dashboard after a push. `S` is flake8-bandit (Sonar's security
# hotspots), `C90` cyclomatic complexity, `PL` the pylint port, `DTZ`
# timezone-naive datetimes, `T20` stray prints, `LOG`/`G` logging misuse.
select = [
    "E", "F", "W", "B", "C4", "UP", "SIM", "RET", "ARG", "PTH", "N", "D",
    "S", "C90", "PL", "PERF", "RUF", "A", "DTZ", "T20", "PIE", "LOG", "G",
]
ignore = [
    "D107",    # missing docstring in __init__
    "D203",    # conflicts with D211
    "D213",    # conflicts with D212
    # Ambiguous-unicode. The prose in this repository uses en and em dashes
    # deliberately, in docstrings and comments where no parser is involved.
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# A test asserts, and compares against the literal values under test. S101 and
# PLR2004 are correct about the code and wrong about test code specifically.
# PLR0913 likewise: a test taking several fixtures is a test, not a design
# problem.
"tests/*" = ["D", "ARG", "S101", "S105", "S106", "PLR2004", "PLR0913", "PLR0917"]

[tool.ruff.lint.mccabe]
# Ruff's default is 10. Twelve leaves room for the band ladder and stays well
# inside SonarCloud's own default cognitive-complexity threshold of 15.
max-complexity = 12

[tool.ruff.lint.pylint]
# SonarCloud's default maximum is 7. Matching it here means a function that
# passes locally passes there, rather than being reported after the fact.
max-args = 7
max-positional-args = 7

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.vulture]
paths = ["siat_foreign_analysis", "tests"]
exclude = [".venv"]
# The default of 60 produces false positives on dataclass fields and on
# exception classes that are raised in one module and caught in another.
min_confidence = 80
sort_by_size = true

# ---------------------------------------------------------------------------
# Testing
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--cov=.",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=95",
]
markers = [
    "baseline: asserts output identical to the recorded 1.1.0 reports; these are the tests that make a scoring change visible rather than silent",
]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", ".venv/*"]
branch = true
# Paths in coverage.xml are written relative to the repository root rather
# than to `source`. Without this, coverage.py emits `cli.py` against a
# <source> of `.../siat_foreign_analysis`, and any consumer resolving paths
# from the project root - SonarCloud among them - matches nothing and reports
# 0% coverage without erroring. `siat_foreign_analysis/cli.py` resolves.
relative_files = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

# SonarQube analysis settings.
#
# The project key and organization are deliberately not here. They are passed
# on the command line from secrets, so this file carries no value that has to
# be kept in step with an account. A key hard-coded here and changed there
# fails with an authorization error that names neither.

sonar.projectName=siat-foreign-analysis

# General Settings
sonar.sources=foreign_analysis.py
sonar.sourceEncoding=UTF-8
sonar.python.version=3.10

# Scanner debug logging. Off by default: it multiplies the size of every CI
# log, which makes the one line that matters harder to find. Turn it on when
# diagnosing the scanner itself, not as a standing setting.
sonar.verbose=false

# Source Exclusion
# sonar.exclusions=

# Rule Exclusions
# S107 (too many parameters). read_json takes five, four of them keyword-only
# with defaults, which is the bounded-read contract rather than a function
# doing too much.
sonar.issue.ignore.multicriteria = e1
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.py
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S107
